# Sample configuration for a kubernetes cluster that has
# - Cert Manager with a ClusterIssuer called "letsencrypt"
# - ingress-nginx installed
# - MongoDB and RabbitMQ from the operator manifests in https://github.com/osie/deployment
global:
  ingress:
    enabled: true
    hostname: "osie.mycompany.com"
    ingressClassName: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    secrets: []
    tls: true

externalMongodb:
  hosts: "mongodb-rs0"
  database: osie
  existingSecret: mongodb-users
  existingSecretUsernameKey: MONGODB_DATABASE_ADMIN_USER
  existingSecretPasswordKey: MONGODB_DATABASE_ADMIN_PASSWORD

externalRabbitmq:
  host: rabbitmq
  existingSecret: rabbitmq-default-user
  existingSecretUsernameKey: username
  existingSecretPasswordKey: password
